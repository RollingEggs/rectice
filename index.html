<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>
<title>Tape Recorder</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app" id="app">

  <header class="header">
    <h1 class="title"><span class="title-tape">TAPE</span> <span class="title-rec">RECORDER</span></h1>
    <div class="header-right">
      <span class="track-label" id="trackLabel">NO TRACK</span>
      <button class="icon-btn" id="loadBtn" title="音楽ファイルを読み込む" aria-label="音楽ファイルを読み込む">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
          <path d="M3 7.5C3 6.67 3.67 6 4.5 6H9.5L11.5 8H19.5C20.33 8 21 8.67 21 9.5V17.5C21 18.33 20.33 19 19.5 19H4.5C3.67 19 3 18.33 3 17.5V7.5Z"
            stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </button>
      <!-- Extensions are listed alongside the wildcards: some OS/browser combos fail to
           map a file to its MIME type, which made audio files unselectable. -->
      <input
        type="file"
        id="fileInput"
        accept="audio/*,video/*,.mp3,.wav,.m4a,.aac,.flac,.ogg,.oga,.opus,.weba,.wma,.aif,.aiff,.mp4,.m4v,.mov,.webm,.mkv,.avi,.3gp,.wmv,.flv"
        hidden
      />
    </div>
  </header>

  <div class="lcd" id="lcd">
    <div class="lcd-main" id="timeDisplay">00:00.0</div>
    <div class="lcd-right">
      <div class="meter-row">
        <span class="meter-label" id="meterLabel">IN</span>
        <div class="meter" id="meter" role="meter" aria-label="外部入力レベル"></div>
      </div>
      <div class="lcd-sub"><span id="markerADisplay">A --:--.-</span> <span id="markerBDisplay">B --:--.-</span></div>
    </div>
  </div>

  <div class="transport-row">
    <button class="btn btn-transport" id="rewindBtn" aria-label="巻き戻し">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 6L4 12L12 18V6Z" fill="currentColor"/><path d="M21 6L13 12L21 18V6Z" fill="currentColor"/></svg>
    </button>
    <button class="btn btn-transport btn-play" id="playBtn" aria-label="再生">
      <svg viewBox="0 0 24 24" width="26" height="26" id="playIcon"><path d="M7 5L19 12L7 19V5Z" fill="currentColor"/></svg>
    </button>
    <button class="btn btn-transport" id="ffBtn" aria-label="早送り">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M3 6L11 12L3 18V6Z" fill="currentColor"/><path d="M12 6L20 12L12 18V6Z" fill="currentColor"/></svg>
    </button>
  </div>

  <div class="rec-row">
    <button class="btn btn-marker" id="markerABtn">
      <span class="dot" id="dotA"></span><span>A</span>
    </button>

    <div class="rec-wrap" id="recWrap">
      <span class="ripple"></span>
      <span class="ripple"></span>
      <span class="ripple"></span>
      <button class="rec-btn" id="recBtn" aria-label="録音（長押しで録音トラックを消去）">
        <span class="rec-btn-inner"></span>
      </button>
    </div>

    <button class="btn btn-marker" id="markerBBtn">
      <span class="dot" id="dotB"></span><span>B</span>
    </button>
  </div>

  <div class="marker-row marker-row-3">
    <button class="btn btn-small" id="loopABBtn">A&#8644;B</button>
    <button class="btn btn-small" id="playABtn">&#9658;A</button>
    <button class="btn btn-small" id="playBBtn">&#9658;B</button>
  </div>

  <div class="mixer">
    <div class="slider-block">
      <div class="slider-labels">
        <span class="label-left label-accent">MUSIC</span>
        <span class="label-center">BALANCE</span>
        <span class="label-right">GUITAR</span>
      </div>
      <input type="range" id="balanceSlider" class="slider" min="-1" max="1" step="0.01" value="0" />
    </div>
    <div class="slider-block">
      <div class="slider-labels">
        <span class="label-left">L</span>
        <span class="label-center">PAN</span>
        <span class="label-right">R</span>
      </div>
      <input type="range" id="panSlider" class="slider" min="-1" max="1" step="0.01" value="0" />
    </div>

    <div class="slider-block">
      <div class="slider-labels">
        <span class="label-left">TRACK 2</span>
        <span class="label-center">TIMING</span>
        <span class="label-right">5ms STEP</span>
      </div>
      <div class="offset-row">
        <button class="btn btn-offset" id="offsetMinusBtn" aria-label="トラック2を5ms早める">−</button>
        <span class="offset-readout" id="offsetReadout">0 ms</span>
        <button class="btn btn-offset" id="offsetPlusBtn" aria-label="トラック2を5ms遅らせる">+</button>
      </div>
    </div>
  </div>

  <p class="status" id="statusMsg"></p>
</div>

<script src="app.js"></script>
</body>
</html>
