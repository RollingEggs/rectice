<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>
<title>Tape Recorder</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app" id="app">

  <div class="lcd" id="lcd">
    <div class="lcd-row">
      <div class="lcd-main" id="timeDisplay">00:00.0</div>
      <div class="meter-row">
        <span class="meter-label" id="meterLabel">IN</span>
        <div class="meter" id="meter" role="meter" aria-label="外部入力レベル"></div>
      </div>
    </div>
    <div class="lcd-row">
      <div class="lcd-sub"><span id="markerADisplay">A --:--.-</span> <span id="markerBDisplay">B --:--.-</span></div>
      <span class="rec-mark" id="recMark" role="img" aria-label="録音データあり">
        <svg viewBox="0 0 24 24" width="28.5" height="28.5" aria-hidden="true">
          <ellipse cx="12" cy="16.2" rx="5.4" ry="4.3" fill="currentColor" />
          <ellipse cx="5.5" cy="10.4" rx="2.3" ry="2.9" fill="currentColor" transform="rotate(-22 5.5 10.4)" />
          <ellipse cx="9.7" cy="7.1" rx="2.2" ry="3" fill="currentColor" transform="rotate(-8 9.7 7.1)" />
          <ellipse cx="14.3" cy="7.1" rx="2.2" ry="3" fill="currentColor" transform="rotate(8 14.3 7.1)" />
          <ellipse cx="18.5" cy="10.4" rx="2.3" ry="2.9" fill="currentColor" transform="rotate(22 18.5 10.4)" />
        </svg>
      </span>
    </div>
    <div class="lcd-file" id="lcdFileName">NO TRACK</div>
  </div>

  <div class="transport-row">
    <button class="btn btn-transport" id="rewindBtn" aria-label="巻き戻し">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 6L4 12L12 18V6Z" fill="currentColor"/><path d="M21 6L13 12L21 18V6Z" fill="currentColor"/></svg>
    </button>
    <button class="btn btn-transport btn-play" id="playBtn" aria-label="再生">
      <svg viewBox="0 0 24 24" width="26" height="26" id="playIcon"><path d="M7 5L19 12L7 19V5Z" fill="currentColor"/></svg>
    </button>
    <button class="btn btn-transport" id="ffBtn" aria-label="早送り">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M3 6L11 12L3 18V6Z" fill="currentColor"/><path d="M12 6L20 12L12 18V6Z" fill="currentColor"/></svg>
    </button>
  </div>

  <div class="rec-row">
    <button class="btn btn-marker" id="markerABtn">
      <span class="dot" id="dotA"></span><span id="markerALabel">A</span>
    </button>

    <div class="rec-wrap" id="recWrap">
      <span class="ripple"></span>
      <span class="ripple"></span>
      <span class="ripple"></span>
      <button class="rec-btn" id="recBtn" aria-label="録音（長押しで録音トラックを消去）">
        <span class="rec-btn-inner"></span>
      </button>
    </div>

    <button class="btn btn-marker" id="markerBBtn">
      <span class="dot" id="dotB"></span><span id="markerBLabel">B</span>
    </button>
  </div>

  <div class="marker-row marker-row-mix">
    <button class="btn btn-toggle btn-toggle-compact" id="track2MuteBtn" aria-label="録音トラックのミュート切り替え">
      <span class="toggle-head"><span class="dot set" id="dotTrack2"></span>REC TRACK</span>
      <span class="toggle-state" id="track2State">ON</span>
    </button>
    <button class="btn btn-toggle btn-toggle-compact" id="countInBtn" aria-label="カウントイン（長押しで設定）">
      <span class="toggle-head"><span class="dot" id="dotCountIn"></span>COUNT IN</span>
      <span class="toggle-state" id="countInState">OFF</span>
    </button>
    <button class="btn btn-small" id="loopABBtn">A&#8644;B</button>
  </div>

  <div class="mixer">
    <div class="slider-block">
      <div class="slider-labels">
        <span class="label-left label-accent">MUSIC</span>
        <span class="label-center">BALANCE</span>
        <span class="label-right">GUITAR</span>
      </div>
      <input type="range" id="balanceSlider" class="slider" min="-1" max="1" step="0.01" value="0" />
    </div>
    <div class="slider-block slider-block-compact">
      <div class="slider-labels">
        <span class="label-left">L</span>
        <span class="label-center">PAN</span>
        <span class="label-right">R</span>
      </div>
      <input type="range" id="panSlider" class="slider" min="-1" max="1" step="0.01" value="0" />
    </div>

    <div class="slider-block slider-block-compact">
      <div class="slider-labels">
        <span class="label-left">TRACK 2</span>
        <span class="label-center">TIMING</span>
        <span class="label-right">5ms STEP</span>
      </div>
      <div class="offset-row">
        <button class="btn btn-offset" id="offsetMinusBtn" aria-label="トラック2を5ms早める">−</button>
        <span class="offset-readout" id="offsetReadout">0 ms</span>
        <button class="btn btn-offset" id="offsetPlusBtn" aria-label="トラック2を5ms遅らせる">+</button>
      </div>
    </div>

    <div class="monitor-row">
      <button class="btn btn-toggle" id="monitorBtn" aria-label="入力モニターの切り替え（長押しで入力デバイスを選択）">
        <span class="dot" id="dotMonitor"></span>
        <span>INPUT MONITOR</span>
        <span class="toggle-state" id="monitorState">MUTED</span>
      </button>

      <button class="icon-btn" id="loadBtn" title="音楽ファイルを読み込む" aria-label="音楽ファイルを読み込む">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
          <path d="M3 7.5C3 6.67 3.67 6 4.5 6H9.5L11.5 8H19.5C20.33 8 21 8.67 21 9.5V17.5C21 18.33 20.33 19 19.5 19H4.5C3.67 19 3 18.33 3 17.5V7.5Z"
            stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </button>
      <!-- Extensions are listed alongside the wildcards: some OS/browser combos fail to
           map a file to its MIME type, which made audio files unselectable. -->
      <input
        type="file"
        id="fileInput"
        accept="audio/*,video/*,.mp3,.wav,.m4a,.aac,.flac,.ogg,.oga,.opus,.weba,.wma,.aif,.aiff,.mp4,.m4v,.mov,.webm,.mkv,.avi,.3gp,.wmv,.flv"
        hidden
      />
    </div>
  </div>

  <p class="status" id="statusMsg"></p>
</div>

<div class="modal-backdrop" id="countInModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="カウントイン設定">
    <h2 class="modal-title">COUNT IN</h2>

    <div class="modal-block-row">
      <button class="btn btn-offset" id="countStartMinusBtn" aria-label="開始位置を1ms早める">−</button>
      <span class="time-field">
        <button class="btn-sign" id="countSignBtn" aria-label="先頭より前か後かを切り替え">−</button>
        <input
          class="modal-input time-input"
          id="countMinInput"
          type="number"
          inputmode="numeric"
          min="0"
          max="5"
          step="1"
          value="0"
          aria-label="分"
        />
        <span class="time-sep">:</span>
        <input
          class="modal-input time-input"
          id="countSecInput"
          type="number"
          inputmode="numeric"
          min="0"
          max="59"
          step="1"
          value="00"
          aria-label="秒"
        />
        <span class="time-sep">.</span>
        <input
          class="modal-input time-input time-ms-input"
          id="countMsInput"
          type="number"
          inputmode="numeric"
          min="0"
          max="999"
          step="1"
          value="000"
          aria-label="ミリ秒"
        />
      </span>
      <button class="btn btn-offset" id="countStartPlusBtn" aria-label="開始位置を1ms遅らせる">+</button>
    </div>

    <div class="modal-row">
      <span class="modal-label">TEMPO</span>
      <button class="btn btn-offset" id="bpmMinusBtn" aria-label="テンポを下げる">−</button>
      <span class="modal-field">
        <input
          class="modal-input"
          id="bpmInput"
          type="number"
          inputmode="numeric"
          min="40"
          max="300"
          step="1"
          value="120"
          aria-label="テンポ（BPM）"
        />
        <span class="modal-unit">BPM</span>
      </span>
      <button class="btn btn-offset" id="bpmPlusBtn" aria-label="テンポを上げる">+</button>
    </div>

    <div class="modal-row">
      <span class="modal-label">BEATS</span>
      <button class="btn btn-offset" id="beatsMinusBtn" aria-label="拍数を減らす">−</button>
      <span class="modal-value" id="beatsValue">4</span>
      <button class="btn btn-offset" id="beatsPlusBtn" aria-label="拍数を増やす">+</button>
    </div>

    <div class="modal-row">
      <span class="modal-label">VOLUME</span>
      <button class="btn btn-offset" id="countVolMinusBtn" aria-label="カウント音量を下げる">−</button>
      <span class="modal-value" id="countVolValue">70 %</span>
      <button class="btn btn-offset" id="countVolPlusBtn" aria-label="カウント音量を上げる">+</button>
    </div>

    <div class="modal-actions">
      <button class="btn btn-small" id="countInPreviewBtn">PREVIEW</button>
      <button class="btn btn-small" id="countInCloseBtn">CLOSE</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="deviceModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="入力デバイスの選択">
    <h2 class="modal-title">INPUT DEVICE</h2>

    <div class="device-list" id="deviceList"></div>
    <p class="modal-hint" id="deviceHint"></p>

    <div class="modal-actions">
      <button class="btn btn-small" id="deviceRefreshBtn">REFRESH</button>
      <button class="btn btn-small" id="deviceCloseBtn">CLOSE</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
